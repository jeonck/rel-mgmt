<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Release Board — DevOps Go / NoGo</title>
    <meta
      name="description"
      content="Nightly release, end-of-life and CVE tracking for 55 DevOps products, scored into a GO / HOLD / NO-GO adoption verdict."
    />
    <meta property="og:title" content="Release Board — DevOps Go / NoGo" />
    <meta
      property="og:description"
      content="Nightly release, end-of-life and CVE tracking for 55 DevOps products, scored into a GO / HOLD / NO-GO adoption verdict."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rel-mgmt.metacog.co.kr" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0c10'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2334d399' stroke-width='3'/%3E%3C/svg%3E" />
    <script>
      // FOUC 방지 — React 마운트 전에 저장된 테마를 적용한다
      (function () {
        try {
          var saved = localStorage.getItem('relboard.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
